name: CI

on:
  pull_request:
    branches: [main, development]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main, development]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Manual only — `record-snapshots` below is the whole reason this trigger
  # exists. Nothing else in this file runs on it.
  workflow_dispatch:

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/0.63.2/portable_swiftlint.zip"
          unzip -o swiftlint.zip -d /tmp/swiftlint
      - name: SwiftLint
        run: /tmp/swiftlint/swiftlint lint --reporter github-actions-logging

  test:
    name: Run Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pin Xcode 26.4 explicitly (was `latest-stable`, which resolved to
      # 26.3 on the macos-15 image). Xcode 26.3's XCTest runtime has a
      # double-free bug ("pointer being freed was not allocated") that crashes
      # the first `@MainActor` test class using an `async setUp()` — for us
      # BYOHermesPromptViewModelTests — aborting the whole run. The bug is
      # fixed in 26.4, which is the latest-stable on the macos-26 image and
      # passes the full suite. LuminaVaultShared ≥ 1.3.0 also needs
      # swift-tools 6.2, which 26.x satisfies. The "ensure iOS runtime" step
      # below covers images shipping without a preinstalled simulator runtime.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Ensure an iOS simulator runtime is installed
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q "^iOS"; then
            echo "no iOS simulator runtime — downloading (one-time per image)"
            sudo xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('LuminaVaultClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The real Config.*.xcconfig files are gitignored (they hold secrets).
      # CI has no secrets and tests use mocks, so materialize them from the
      # committed .sample placeholders purely to satisfy the pbxproj
      # baseConfigurationReference. Never overwrite a real file if present.
      - name: Materialize xcconfig from samples
        run: |
          set -euo pipefail
          for cfg in Debug Release Beta GoogleAuth; do
            src="LuminaVaultClient/Config/Config.$cfg.xcconfig"
            [ "$cfg" = "GoogleAuth" ] && src="LuminaVaultClient/Config/GoogleAuth.xcconfig"
            if [ ! -f "$src" ] && [ -f "$src.sample" ]; then
              cp "$src.sample" "$src"
              echo "materialized $src"
            fi
          done

      - name: Resolve Swift packages
        run: xcodebuild -project LuminaVaultClient.xcodeproj -resolvePackageDependencies

      # Both axes are pinned. "OS=latest" used to resolve to the newest
      # installed runtime, on the theory that the rasterizer is stable across
      # point releases. It is not: when this image gained iOS 26.5, `latest`
      # moved off 26.4 and `RedesignChromeSnapshotTests.testThinkEmptyHero`
      # started failing on `think-empty-dark` — reproducibly on CI, never
      # locally on 26.4, with no code change behind it.
      #
      # A floating renderer version means CI goes red on Apple's release
      # schedule instead of on our changes. Bumping OS_VERSION below is now a
      # deliberate act, paired with re-recording whichever baselines move.
      - name: List simulator runtimes (diagnostics only)
        run: xcrun simctl list runtimes

      # The device is pinned, not discovered. Snapshot baselines are
      # device-specific: `layout: .device(config: .iPhone13Pro)` fixes the
      # canvas size, but the render still varies with the host simulator's
      # device class. `RedesignChromeSnapshotTests.testThinkEmptyHero` is the
      # proof — on iPhone 17 Pro Max it fails with *identical* numbers
      # (0.96658325 / 0.7034375) on iOS 26.4 locally and iOS 26.5 on this
      # runner, and passes on iPhone 16 Pro on both. The variable is the
      # device; the runtime patch level is not.
      #
      # The previous step picked `sorted(pros)[-1]`, the newest Pro iPhone on
      # the image. That silently re-pointed the reference device from
      # iPhone 16 Pro to iPhone 17 Pro Max when macos-26 gained the newer
      # preset, invalidating baselines nobody had touched. Pin the device the
      # baselines are recorded against, and create it when the image does not
      # preinstall it — macos-26 does drop presets the macos-15 image had,
      # which is what the dynamic pick was originally working around.
      #
      # There is deliberately NO fallback to "some other iPhone". Running the
      # snapshot suites on an unintended device produces confusing red rather
      # than a clear failure, which is exactly the bug this replaces.
      - name: Run unit tests (Debug)
        run: |
          set -euo pipefail
          DEVICE="iPhone 16 Pro"
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro"
          # Pinned, not floating — see the comment above the diagnostics step.
          OS_VERSION="26.4"
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-26-4"
          if ! xcrun simctl list runtimes | grep -q "$RUNTIME_ID"; then
            echo "::error::iOS $OS_VERSION runtime is not on this runner — snapshot baselines are recorded against it"
            xcrun simctl list runtimes
            exit 1
          fi
          # Ask for the device *on the pinned runtime*, then target its UDID.
          #
          # The previous check asked only whether some device named "$DEVICE"
          # was available anywhere. The macos-26 image preinstalls an
          # iPhone 16 Pro on the newest runtime it ships, so that check passed,
          # nothing was created on $OS_VERSION, and the run died on
          # `-destination ...,OS=$OS_VERSION` with "no available devices
          # matched" — the runtime was there the whole time, on a device
          # nobody had created.
          # `|| true` and a matching `sed -n` rather than `grep`: under
          # `set -euo pipefail` a grep that matches nothing exits 1 and kills
          # the step before the create-it branch below can run, which is
          # exactly how this failed — 0.6s, no output, not even the echo.
          UDID=$(xcrun simctl list devices available \
            | awk -v hdr="-- iOS ${OS_VERSION} --" '$0==hdr{f=1;next} /^-- /{f=0} f' \
            | sed -nE "s/^ +${DEVICE} \(([0-9A-Fa-f-]{36})\).*/\1/p" \
            | head -1 || true)
          if [ -z "$UDID" ]; then
            echo "::notice::'${DEVICE}' does not exist on iOS ${OS_VERSION} — creating it"
            UDID=$(xcrun simctl create "$DEVICE" "$DEVICE_TYPE" "$RUNTIME_ID")
          fi
          echo "Using simulator: $DEVICE on iOS $OS_VERSION ($UDID) — pinned, baselines are recorded on it"
          xcodebuild test \
            -project LuminaVaultClient.xcodeproj \
            -scheme LuminaVaultClient \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:LuminaVaultClientTests \
            -resultBundlePath TestResults.xcresult

      - name: Export coverage JSON
        if: always()
        run: |
          set -euo pipefail
          if [[ -d TestResults.xcresult ]]; then
            xcrun xccov view --report --json TestResults.xcresult > coverage.json || true
          else
            echo "::notice::no xcresult bundle; skipping coverage export"
            : > coverage.json
          fi

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore

      # A snapshot mismatch is a picture; the log only says "does not match
      # reference" and a precision number. The xcresult carries the failure
      # attachments (reference, actual, diff), so keep it when tests fail.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Manual only. Snapshot baselines are recorded against CI's renderer, not a
  # developer's: an Xcode 26.2 machine cannot write PNGs that a 26.4 runner
  # will accept, so a new or changed snapshot suite ships with no baseline and
  # is recorded here.
  #
  # Quarantined cases are gated on `SNAPSHOT_TESTING_RECORD` through
  # `SnapshotQuarantine.skipUnlessRecording()`, so they skip on the PR job and
  # run on this one. That is why the variable has to reach the test process
  # and not just this shell — see the env block on the record step.
  #
  # Run it from the Actions tab, download the `snapshots-<sha>` artifact,
  # unzip it over `LuminaVaultClientTests/__Snapshots__/`, commit the PNGs,
  # and delete that suite's `skipUnlessRecording()` calls.
  #
  # Compiling and recording are two steps on purpose. A recording run fails by
  # design — every `assertSnapshot` that writes a reference reports a failure —
  # so the run step has to be `continue-on-error`, and that same flag would
  # also swallow a compile error and hand the upload whatever stale PNGs the
  # checkout happened to carry. `build-for-testing` therefore runs on its own
  # and is allowed to fail the job, `test-without-building` does the recording
  # under `continue-on-error`, and the upload is gated on the build's outcome.
  record-snapshots:
    name: Record snapshot baselines
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same pin as "Run Tests" — the baselines this job writes are only
      # valid for the toolchain the PR job will compare them on.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Ensure an iOS simulator runtime is installed
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q "^iOS"; then
            echo "no iOS simulator runtime — downloading (one-time per image)"
            sudo xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('LuminaVaultClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Materialize xcconfig from samples
        run: |
          set -euo pipefail
          for cfg in Debug Release Beta GoogleAuth; do
            src="LuminaVaultClient/Config/Config.$cfg.xcconfig"
            [ "$cfg" = "GoogleAuth" ] && src="LuminaVaultClient/Config/GoogleAuth.xcconfig"
            if [ ! -f "$src" ] && [ -f "$src.sample" ]; then
              cp "$src.sample" "$src"
              echo "materialized $src"
            fi
          done

      - name: Resolve Swift packages
        run: xcodebuild -project LuminaVaultClient.xcodeproj -resolvePackageDependencies

      # Device and runtime pinned exactly as in "Run unit tests (Debug)" —
      # see the comments above that step for why both axes are fixed. A
      # baseline recorded on any other device or runtime is worse than none.
      - name: Resolve the recording simulator
        run: |
          set -euo pipefail
          DEVICE="iPhone 16 Pro"
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro"
          OS_VERSION="26.4"
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-26-4"
          if ! xcrun simctl list runtimes | grep -q "$RUNTIME_ID"; then
            echo "::error::iOS $OS_VERSION runtime is not on this runner — snapshot baselines are recorded against it"
            xcrun simctl list runtimes
            exit 1
          fi
          UDID=$(xcrun simctl list devices available \
            | awk -v hdr="-- iOS ${OS_VERSION} --" '$0==hdr{f=1;next} /^-- /{f=0} f' \
            | sed -nE "s/^ +${DEVICE} \(([0-9A-Fa-f-]{36})\).*/\1/p" \
            | head -1 || true)
          if [ -z "$UDID" ]; then
            echo "::notice::'${DEVICE}' does not exist on iOS ${OS_VERSION} — creating it"
            UDID=$(xcrun simctl create "$DEVICE" "$DEVICE_TYPE" "$RUNTIME_ID")
          fi
          echo "Recording on: $DEVICE on iOS $OS_VERSION ($UDID)"
          echo "RECORD_DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

      # No `continue-on-error`: a compile failure has to fail this job, or the
      # upload below would ship whatever PNGs the checkout already had as if
      # they were freshly recorded.
      - name: Build tests for recording (Debug)
        id: build_for_testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project LuminaVaultClient.xcodeproj \
            -scheme LuminaVaultClient \
            -configuration Debug \
            -destination "$RECORD_DESTINATION"

      # `continue-on-error` belongs here and only here: a recording run fails
      # by design, because every `assertSnapshot` that writes a reference
      # reports a failure.
      - name: Record snapshots (Debug)
        continue-on-error: true
        env:
          # The `TEST_RUNNER_` prefix is the delivery mechanism, not a
          # different setting: a bare `SNAPSHOT_TESTING_RECORD` here would only
          # reach this shell, and the tests run in a separate process on the
          # simulator. xcodebuild strips the prefix and forwards the rest into
          # the test runner's environment, where swift-snapshot-testing (1.19.4)
          # reads it to turn recording on — and where
          # `SnapshotQuarantine.skipUnlessRecording()` reads it to let the
          # quarantined cases run instead of skipping.
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: all
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project LuminaVaultClient.xcodeproj \
            -scheme LuminaVaultClient \
            -configuration Debug \
            -destination "$RECORD_DESTINATION" \
            -only-testing:LuminaVaultClientTests

      - name: Upload recorded snapshots
        if: steps.build_for_testing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.sha }}
          path: LuminaVaultClientTests/__Snapshots__
          if-no-files-found: error
          retention-days: 14
