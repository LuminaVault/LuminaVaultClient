name: TestFlight Beta

# Ships the Beta identity (com.lumina.fernando.beta) to TestFlight.
# Production App Store uploads use release.yml (manual until ASC app exists).
#
# Trigger: the "CI" workflow finishing green on main or development. Two bugs
# in the previous `push: [development]` trigger this replaces:
#
#   1. It was a SIBLING of CI, not a consumer — both started on the same commit
#      at the same second, so a red test suite did not stop the upload.
#   2. It never actually fired. Work lands on main, not development, so every
#      run since 2026-05-27 reported "skipped" in ~1s and no build reached
#      TestFlight for months. workflow_run now watches both branches.
#
# Two workflow_run facts worth knowing:
#   * GitHub reads this trigger from the workflow file on the DEFAULT branch
#     (main), so this change only takes effect once it is merged there.
#   * The event's github.sha/github.ref point at the default-branch tip, not
#     the commit that was tested — hence the explicit head_sha checkout.
#
# Path filters are inherited from CI (**.md and docs/** are ignored there, so
# no CI run means no TestFlight run). CI does NOT ignore .github/**, which the
# old trigger did — a workflow-only commit will now ship a build.

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "TestFlight changelog (shown to internal testers)"
        required: false
        default: "Latest internal build."
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - development

concurrency:
  group: lumina-testflight
  cancel-in-progress: false

jobs:
  beta:
    # A dispatch is deliberate; a workflow_run only ships when CI was green.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      BUILD_NUMBER: ${{ github.run_number }}
      CHANGELOG: ${{ github.event.inputs.changelog || format('{0} @ {1}', github.event.workflow_run.head_branch || github.ref_name, github.event.workflow_run.head_sha || github.sha) }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # Must be an HTTPS URL in CI. The Matchfile default is the SSH remote,
      # which works locally off your own key but has nothing to authenticate
      # with on a runner, and org policy disables deploy keys — so match reads
      # the certs repo over HTTPS with a PAT instead.
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      # base64 of "x-access-token:<PAT>", PAT needs Contents:Read on
      # LuminaVault/LuminaVaultIOSSecrets. Without this, match cannot clone the
      # certs repo and the lane dies at signing.
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default-branch tip; build what CI tested.
          # Empty on workflow_dispatch, where checkout falls back to the ref.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('LuminaVaultClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Real Config.*.xcconfig files are gitignored. Prefer a full Beta config
      # secret when set; otherwise copy the sample so the pbxproj reference resolves.
      - name: Materialize Beta xcconfig
        env:
          CONFIG_BETA_XCCONFIG: ${{ secrets.CONFIG_BETA_XCCONFIG }}
        run: |
          set -euo pipefail
          dest="LuminaVaultClient/Config/Config.Beta.xcconfig"
          if [ -n "${CONFIG_BETA_XCCONFIG:-}" ]; then
            printf '%s\n' "$CONFIG_BETA_XCCONFIG" > "$dest"
            echo "Wrote $dest from CONFIG_BETA_XCCONFIG secret"
          elif [ -f "${dest}.sample" ]; then
            cp "${dest}.sample" "$dest"
            echo "Materialized $dest from sample (set CONFIG_BETA_XCCONFIG for real values)"
          else
            echo "Missing Beta xcconfig sample" >&2
            exit 1
          fi
          # Debug/Release also referenced by the project graph; placeholders are fine.
          for cfg in Debug Release; do
            src="LuminaVaultClient/Config/Config.$cfg.xcconfig"
            if [ ! -f "$src" ] && [ -f "$src.sample" ]; then
              cp "$src.sample" "$src"
            fi
          done

      - name: Resolve Swift packages
        run: xcodebuild -project LuminaVaultClient.xcodeproj -resolvePackageDependencies

      - name: Build + upload to TestFlight
        run: bundle exec fastlane beta
